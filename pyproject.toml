[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-agentico-observability"
version = "0.1.0"
description = "Local, read-only observability for AI coding agents: incremental JSONL→SQLite reader, token-based cost model with dated pricing, and a nightly review that only narrates SQL-computed facts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# The reader runs on the standard library only. No runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

# Nothing to package: the reader runs as scripts (`python3 reader/reader.py`).
# Declaring no packages stops setuptools from auto-discovering web/, demo/…
# so `pip install -e ".[dev]"` only installs the dev tools.
[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Temporary files stay inside the repo (ignored by git), never in the system /tmp.
addopts = "-q --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["reader", "demo", "tests"]
extend-exclude = ["web", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# The code keeps aligned tables; these rules fight that style without catching
# bugs.
ignore = [
  "E731",   # lambda assignments in small lookup helpers
  "B905",   # zip() without strict= (Python 3.11 target)
  "UP017",  # datetime.UTC alias: keep timezone.utc explicit
]

[tool.ruff.lint.per-file-ignores]
# sys.path is set before importing the sibling modules, on purpose.
"reader/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["common", "reader", "pricing", "detectors", "habits", "conversations", "review", "sources"]
